name: Deploy Master to IIS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy_all:
        description: Force deploy API, portal, app, and landing regardless of detected path changes
        required: false
        default: false
        type: boolean
      deploy_targets:
        description: Comma-separated targets (auto|all|api|portal|app|landing)
        required: false
        default: auto
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_ROOT: C:\WebApps\TripleA
  DEPLOY_BACKUP_RETENTION: ${{ vars.DEPLOY_BACKUP_RETENTION || '1' }}
  API_DESTINATION: C:\WebApps\TripleA\api
  PORTAL_DESTINATION: C:\WebApps\TripleA\portal
  APP_DESTINATION: C:\WebApps\TripleA\app
  LANDING_DESTINATION: C:\WebApps\TripleA
  BACKUP_ROOT: C:\WebApps\TripleA\_backups
  IIS_SITE_NAME: ${{ vars.IIS_SITE_NAME || 'KPW' }}
  API_APP_POOL: ${{ vars.API_APP_POOL || 'KPW' }}
  PORTAL_APP_POOL: ${{ vars.PORTAL_APP_POOL || 'KPW' }}
  APP_APP_POOL: ${{ vars.APP_APP_POOL || 'KPW' }}
  LANDING_APP_POOL: ${{ vars.LANDING_APP_POOL || 'KPW' }}
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://mytriplea.co.za' }}
  API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://mytriplea.co.za/api/health' }}
  PORTAL_PUBLIC_URL: ${{ vars.PORTAL_PUBLIC_URL || 'https://mytriplea.co.za/portal' }}
  OWNER_APP_PUBLIC_URL: ${{ vars.OWNER_APP_PUBLIC_URL || 'https://mytriplea.co.za/app' }}
  DEPLOY_ASPNETCORE_ENVIRONMENT: ${{ vars.DEPLOY_ASPNETCORE_ENVIRONMENT || 'Staging' }}
  FLUTTER_ROOT: ${{ vars.FLUTTER_ROOT || 'C:\flutter' }}

jobs:
  detect-changes:
    name: Detect Changed Targets
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: self-hosted
    outputs:
      api_changed: ${{ steps.diff.outputs.api_changed }}
      portal_changed: ${{ steps.diff.outputs.portal_changed }}
      app_changed: ${{ steps.diff.outputs.app_changed }}
      landing_changed: ${{ steps.diff.outputs.landing_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          clean: true

      - name: Compute changed paths
        id: diff
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $repoRoot = (Get-Location).Path
          git config --global --add safe.directory $repoRoot 2>$null

          $before = "${{ github.event.before }}"
          $after = "${{ github.sha }}"
          $deployAll = $false

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $manualForceAll = "${{ github.event.inputs.force_deploy_all }}"
            $manualTargetsRaw = "${{ github.event.inputs.deploy_targets }}"
            if ($manualForceAll -eq "true") {
              $deployAll = $true
            } elseif ($manualTargetsRaw) {
              $manualTargets = $manualTargetsRaw.ToLower().Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
              $manualTargets = $manualTargets | Select-Object -Unique

              if ($manualTargets.Count -gt 0 -and ($manualTargets -notcontains 'auto')) {
                $validTargets = @('all', 'api', 'portal', 'app', 'landing')
                $invalidTargets = $manualTargets | Where-Object { $_ -notin $validTargets }
                if ($invalidTargets.Count -gt 0) {
                  throw "Invalid deploy_targets value(s): $($invalidTargets -join ', '). Allowed values: auto, all, api, portal, app, landing"
                }

                $selectAll = $manualTargets -contains 'all'
                $apiChanged = $selectAll -or ($manualTargets -contains 'api')
                $portalChanged = $selectAll -or ($manualTargets -contains 'portal')
                $appChanged = $selectAll -or ($manualTargets -contains 'app')
                $landingChanged = $selectAll -or ($manualTargets -contains 'landing')

                "api_changed=$($apiChanged.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                "portal_changed=$($portalChanged.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                "app_changed=$($appChanged.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                "landing_changed=$($landingChanged.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                exit 0
              }
            } else {
              if (-not $before -or $before -match "^0+$") {
                Write-Host "Manual dispatch without a valid before SHA; deploying all targets."
                $deployAll = $true
              }
            }
          }

          if ($before -match "^0+$") {
            $deployAll = $true
          }

          if (-not $deployAll) {
            git fetch --no-tags --prune --unshallow origin 2>$null | Out-Null
            git fetch --no-tags origin $before 2>$null | Out-Null
            git rev-parse --verify "${before}^{commit}" 2>$null | Out-Null
            $beforeOk = $LASTEXITCODE -eq 0
            if (-not $beforeOk) {
              Write-Warning "Previous commit $before not available on runner; deploying all targets."
              $deployAll = $true
            }
          }

          if ($deployAll) {
            "api_changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "portal_changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "app_changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "landing_changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $changed = git diff --name-only $before $after 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "git diff failed for $before..$after; deploying all targets."
            "api_changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "portal_changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "app_changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "landing_changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $commonChanged = ($changed -match "^(infra/deploy/iis/|\.github/workflows/deploy-master\.yml)").Count -gt 0
          $portalChanged = $commonChanged -or ($changed -match "^physio-portal-vue3/").Count -gt 0
          $apiChanged = $commonChanged -or ($changed -match "^backend-api-dot-net/").Count -gt 0
          $appChanged = $commonChanged -or ($changed -match "^owner-app-flutter/").Count -gt 0
          $landingChanged = $commonChanged -or ($changed -match "^site-landing/").Count -gt 0

          "api_changed=$($apiChanged.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "portal_changed=$($portalChanged.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "app_changed=$($appChanged.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "landing_changed=$($landingChanged.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  deploy-landing:
    name: Deploy Site Landing
    runs-on: self-hosted
    needs: detect-changes
    if: needs.detect-changes.outputs.landing_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Deploy site landing to IIS
        shell: powershell
        run: |
          $params = @{
            SourcePath = "site-landing"
            DestinationPath = "${{ env.LANDING_DESTINATION }}"
            AppPoolName = "${{ env.LANDING_APP_POOL }}"
            SkipBackup = $true
            ExcludeDirectories = @('api', 'portal', 'app', '_backups')
          }

          ./infra/deploy/iis/deploy-iis.ps1 @params

  deploy-portal:
    name: Deploy Portal
    runs-on: self-hosted
    needs: detect-changes
    if: needs.detect-changes.outputs.portal_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: physio-portal-vue3/package-lock.json

      - name: Install dependencies
        shell: powershell
        run: |
          $env:NODE_ENV = "development"
          npm ci --prefix physio-portal-vue3 --include=dev

      - name: Build portal
        shell: powershell
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          Remove-Item Env:NODE_ENV -ErrorAction SilentlyContinue
          if ([string]::IsNullOrWhiteSpace($env:VITE_API_BASE_URL)) {
            throw "VITE_API_BASE_URL is empty; portal would bake in the wrong API origin."
          }
          Write-Host "Building portal with VITE_API_BASE_URL=$($env:VITE_API_BASE_URL)"
          npm run build --prefix physio-portal-vue3

      - name: Verify API origin in portal build
        shell: powershell
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          $jsFiles = Get-ChildItem physio-portal-vue3/dist/assets/*.js -ErrorAction Stop
          $haystack = ($jsFiles | Get-Content -Raw) -join "`n"
          $expected = $env:VITE_API_BASE_URL.TrimEnd('/')
          if ([string]::IsNullOrWhiteSpace($expected)) {
            throw "VITE_API_BASE_URL is empty during verify."
          }
          $escaped = [regex]::Escape($expected)
          if ($haystack -notmatch $escaped) {
            throw "Portal production bundle is missing API origin '$expected'."
          }
          if ($haystack -match 'localhost:(5057|7112)') {
            throw "Portal production bundle still contains a localhost API port (5057 or 7112)."
          }
          Write-Host "Portal bundle contains $expected (SignalR/other libs may still mention the word localhost)."

      - name: Deploy portal to IIS
        shell: powershell
        run: |
          $params = @{
            SourcePath = "physio-portal-vue3/dist"
            DestinationPath = "${{ env.PORTAL_DESTINATION }}"
            AppPoolName = "${{ env.PORTAL_APP_POOL }}"
            SkipBackup = $true
            UseAppOffline = $true
          }

          ./infra/deploy/iis/deploy-iis.ps1 @params

  deploy-app:
    name: Deploy Owner App
    runs-on: self-hosted
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Verify Flutter SDK
        shell: powershell
        run: |
          $candidates = @(
            "${{ env.FLUTTER_ROOT }}\bin",
            "C:\flutter\bin",
            "C:\src\flutter\bin",
            "C:\Program Files\flutter\bin"
          ) | Select-Object -Unique

          foreach ($bin in $candidates) {
            if (Test-Path -LiteralPath (Join-Path $bin "flutter.bat")) {
              $env:PATH = "$bin;$env:PATH"
              "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append
              Write-Host "Using Flutter at $bin"
              flutter --version
              exit 0
            }
          }

          if (Get-Command flutter -ErrorAction SilentlyContinue) {
            flutter --version
            exit 0
          }

          throw @"
          Flutter SDK not found on the runner (service PATH does not include user installs).
          Install Flutter machine-wide, then re-run:

            git clone https://github.com/flutter/flutter.git -b stable C:\flutter
            C:\flutter\bin\flutter.bat doctor
            [Environment]::SetEnvironmentVariable('Path', `$env:Path + ';C:\flutter\bin', 'Machine')

          Or set repo variable FLUTTER_ROOT to the SDK folder (not \bin).
          Checked: $($candidates -join ', ')
          "@.Trim()

      - name: Build owner app (web)
        shell: powershell
        working-directory: owner-app-flutter
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get failed with exit code $LASTEXITCODE" }
          flutter build web --release --base-href /app/ --dart-define=ENV=staging --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          if ($LASTEXITCODE -ne 0) { throw "flutter build web failed with exit code $LASTEXITCODE" }

      - name: Deploy owner app to IIS
        shell: powershell
        run: |
          $params = @{
            SourcePath = "owner-app-flutter/build/web"
            DestinationPath = "${{ env.APP_DESTINATION }}"
            AppPoolName = "${{ env.APP_APP_POOL }}"
            SkipBackup = $true
            UseAppOffline = $true
          }

          ./infra/deploy/iis/deploy-iis.ps1 @params

  deploy-api:
    name: Deploy API
    runs-on: self-hosted
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Verify local .NET SDK
        shell: powershell
        run: |
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files\dotnet\dotnet.exe") {
              $env:PATH = "C:\Program Files\dotnet;$env:PATH"
            } else {
              throw "dotnet SDK not found on runner. Install .NET SDK 9.x on the IIS runner host."
            }
          }

          dotnet --info

      - name: Restore API dependencies
        run: dotnet restore "backend-api-dot-net/KPW.Api/KPW.Api.csproj"

      - name: Publish API
        run: dotnet publish "backend-api-dot-net/KPW.Api/KPW.Api.csproj" -c Release -o "artifacts/api" /p:EnvironmentName=Staging

      - name: Deploy API to IIS
        shell: powershell
        run: |
          $params = @{
            SourcePath = "artifacts/api"
            DestinationPath = "${{ env.API_DESTINATION }}"
            AppPoolName = "${{ env.API_APP_POOL }}"
            BackupRoot = "${{ env.BACKUP_ROOT }}"
            BackupLabel = "api"
            BackupRetentionCount = [int]"${{ env.DEPLOY_BACKUP_RETENTION }}"
            UseAppOffline = $true
          }

          ./infra/deploy/iis/deploy-iis.ps1 @params

      - name: API health check
        if: ${{ env.API_HEALTH_URL != '' }}
        shell: powershell
        run: |
          $url = "${{ env.API_HEALTH_URL }}"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 400) {
                Write-Host "API health check passed on attempt ${attempt}: $url"
                exit 0
              }
            } catch {
              Write-Host "API health check attempt $attempt failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 3
          }

          throw "API health check failed after 5 attempts: $url"
